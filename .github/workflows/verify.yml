name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-scope:
    name: Browser scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_required: ${{ steps.classify.outputs.browser_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - id: classify
        name: Classify browser change scope
        run: node scripts/classify-browser-change.ts

  release-candidate-history:
    name: Release-candidate history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/check-release-candidate-history.ts

  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  package-contract:
    name: Package and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm api:check
      - run: pnpm performance:check
      - run: pnpm size:check
      - run: pnpm verify:packages

  browser-shard:
    name: Browser shard (${{ matrix.display }})
    if: ${{ needs.browser-scope.result == 'success' && needs.browser-scope.outputs.browser_required == 'true' }}
    needs: browser-scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - project: chromium
            browser: chromium
            shard: 1
            total: 2
            display: Chromium 1/2
          - project: chromium
            browser: chromium
            shard: 2
            total: 2
            display: Chromium 2/2
          - project: firefox
            browser: firefox
            shard: 1
            total: 2
            display: Firefox 1/2
          - project: firefox
            browser: firefox
            shard: 2
            total: 2
            display: Firefox 2/2
          - project: webkit
            browser: webkit
            shard: 1
            total: 2
            display: WebKit 1/2
          - project: webkit
            browser: webkit
            shard: 2
            total: 2
            display: WebKit 2/2
          - project: webkit-stacked-deck
            browser: webkit
            shard: 1
            total: 2
            display: WebKit Stacked Deck 1/2
          - project: webkit-stacked-deck
            browser: webkit
            shard: 2
            total: 2
            display: WebKit Stacked Deck 2/2
    env:
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.total }}-attempt-${{ github.run_attempt }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.display }}
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --workers=1
      - name: Upload shard blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-blob-${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.total }}-attempt-${{ github.run_attempt }}
          path: blob-report/*.zip
          if-no-files-found: error
          retention-days: 1

  browser-preview:
    name: Browser production preview
    if: ${{ needs.browser-scope.result == 'success' && needs.browser-scope.outputs.browser_required == 'true' }}
    needs: browser-scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:preview
      - run: pnpm exec playwright test --config playwright.preview.config.ts --workers=1
      - name: Upload preview failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-preview-attempt-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-fixtures:
    name: Browser fixture integration
    if: ${{ needs.browser-scope.result == 'success' && needs.browser-scope.outputs.browser_required == 'true' }}
    needs: browser-scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:fixtures
      - run: pnpm exec playwright test --config playwright.fixtures.config.ts --workers=1
      - name: Upload fixture failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-fixtures-attempt-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-report:
    name: Browser report merge
    if: ${{ always() && needs.browser-scope.result == 'success' && needs.browser-scope.outputs.browser_required == 'true' }}
    needs: [browser-scope, browser-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: playwright-blob-*-attempt-${{ github.run_attempt }}
          path: .artifacts/playwright-blobs
          merge-multiple: true
      - name: Merge browser reports
        run: pnpm exec playwright merge-reports --reporter html .artifacts/playwright-blobs
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload merged browser report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 7

  browser-certification:
    name: Browser certification
    if: ${{ always() }}
    needs:
      - browser-scope
      - browser-shard
      - browser-preview
      - browser-fixtures
      - browser-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Certify browser evidence
        env:
          BROWSER_REQUIRED: ${{ needs.browser-scope.outputs.browser_required }}
          SCOPE_REASON: ${{ needs.browser-scope.outputs.reason }}
          SCOPE_RESULT: ${{ needs.browser-scope.result }}
          SHARD_RESULT: ${{ needs.browser-shard.result }}
          PREVIEW_RESULT: ${{ needs.browser-preview.result }}
          FIXTURE_RESULT: ${{ needs.browser-fixtures.result }}
          REPORT_RESULT: ${{ needs.browser-report.result }}
        run: |
          set -eu
          certified=false
          if [ "$SCOPE_RESULT" != "success" ]; then
            message="Browser certification failed: change-scope classification did not succeed."
          elif [ "$BROWSER_REQUIRED" = "false" ]; then
            if [ "$SHARD_RESULT" = "skipped" ] && [ "$PREVIEW_RESULT" = "skipped" ] && [ "$FIXTURE_RESULT" = "skipped" ] && [ "$REPORT_RESULT" = "skipped" ]; then
              certified=true
              message="Browser certification passed without browser work: $SCOPE_REASON"
            else
              message="Browser certification failed: browser work did not skip coherently for an irrelevant change."
            fi
          elif [ "$BROWSER_REQUIRED" = "true" ]; then
            if [ "$SHARD_RESULT" = "success" ] && [ "$PREVIEW_RESULT" = "success" ] && [ "$FIXTURE_RESULT" = "success" ] && [ "$REPORT_RESULT" = "success" ]; then
              certified=true
              message="Browser certification passed with every shard, preview, fixture, and report job clean."
            else
              message="Browser certification failed: shard=$SHARD_RESULT preview=$PREVIEW_RESULT fixtures=$FIXTURE_RESULT report=$REPORT_RESULT."
            fi
          else
            message="Browser certification failed: change-scope output was missing or invalid."
          fi
          printf '## Browser certification\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "$message"
          if [ "$certified" != "true" ]; then exit 1; fi
