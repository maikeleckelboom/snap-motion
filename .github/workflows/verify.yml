name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-admission:
    name: Repository admission
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      browser_required: ${{ steps.classify.outputs.browser_required }}
      package_integration_required: ${{ steps.classify.outputs.package_integration_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Validate release-candidate history
        run: node scripts/check-release-candidate-history.ts
      - id: classify
        name: Classify browser change scope
        run: node scripts/classify-browser-change.ts

  linux-verification:
    name: Linux verification
    needs: repository-admission
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      package_artifact: ${{ steps.package-authority.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Build package authority
        run: pnpm build:packages
      - run: pnpm typecheck:prepared
      - run: pnpm test:unit
      - name: Build application and fixture authority
        run: pnpm build:apps:prepared
      - run: pnpm api:check:prepared
      - run: pnpm size:check
      - name: Pack prepared package authority
        run: pnpm pack:packages:prepared
      - name: Certify browser-free packed packages
        run: pnpm verify:packages:prepared

      - id: package-authority
        name: Save prepared package authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prepared-package-authority-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            packages/core/dist
            packages/vue/dist
            .artifacts/packages
          if-no-files-found: error
          retention-days: 7

  windows-portability:
    name: Windows portability
    needs: repository-admission
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows package and CLI portability
        run: pnpm verify:portability

  chromium:
    name: Chromium ${{ matrix.group }}
    if: ${{ needs.repository-admission.result == 'success' && needs.repository-admission.outputs.browser_required == 'true' }}
    needs: repository-admission
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        group: [general, deck, direct]
    env:
      SNAP_MOTION_BROWSER_GROUP: ${{ matrix.group }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/browser-${{ matrix.group }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Run Chromium ${{ matrix.group }}
        run: pnpm exec playwright test --project=chromium --workers=2 --reporter=line,json --output=test-results/chromium-${{ matrix.group }}
      - name: Report browser timing
        if: ${{ always() }}
        run: node scripts/reportBrowserTiming.ts .artifacts/browser-${{ matrix.group }}.json .artifacts/timing-${{ matrix.group }}.json
      - name: Upload timing and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-chromium-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/browser-${{ matrix.group }}.json
            .artifacts/timing-${{ matrix.group }}.json
            test-results/chromium-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7

  cross-browser:
    name: Interoperability ${{ matrix.project }}
    if: ${{ needs.repository-admission.result == 'success' && needs.repository-admission.outputs.browser_required == 'true' }}
    needs: repository-admission
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit, webkit-stacked-deck]
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/browser-${{ matrix.project }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Run independent interoperability owner
        run: pnpm exec playwright test --project=${{ matrix.project }} --workers=2 --reporter=line,json --output=test-results/${{ matrix.project }}
      - name: Report browser timing
        if: ${{ always() }}
        run: node scripts/reportBrowserTiming.ts .artifacts/browser-${{ matrix.project }}.json .artifacts/timing-${{ matrix.project }}.json
      - name: Upload timing and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-${{ matrix.project }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/browser-${{ matrix.project }}.json
            .artifacts/timing-${{ matrix.project }}.json
            test-results/${{ matrix.project }}
          if-no-files-found: error
          retention-days: 7

  browser-integration:
    name: Browser integration
    if: ${{ needs.repository-admission.result == 'success' && needs.repository-admission.outputs.package_integration_required == 'true' }}
    needs: [repository-admission, linux-verification]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Reuse exact prepared package authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.linux-verification.outputs.package_artifact }}
      - name: Build production preview
        run: pnpm build:preview:prepared
      - name: Build framework fixtures
        run: pnpm build:fixtures:prepared
      - name: Certify production preview
        run: pnpm exec playwright test --config playwright.preview.config.ts --workers=1 --reporter=line,json --output=test-results/preview
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/browser-preview.json
      - name: Certify framework fixtures
        run: pnpm exec playwright test --config playwright.fixtures.config.ts --workers=1 --reporter=line,json --output=test-results/fixtures
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/browser-fixtures.json
      - name: Certify packed Nuxt build and hydration
        run: pnpm verify:packages:browser:prepared
      - name: Report integration timing
        if: ${{ always() }}
        run: |
          node scripts/reportBrowserTiming.ts .artifacts/browser-preview.json .artifacts/timing-preview.json
          node scripts/reportBrowserTiming.ts .artifacts/browser-fixtures.json .artifacts/timing-fixtures.json
      - name: Upload integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-integration-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/browser-preview.json
            .artifacts/browser-fixtures.json
            .artifacts/timing-preview.json
            .artifacts/timing-fixtures.json
            .artifacts/surface-preferences
            test-results/preview
            test-results/fixtures
          if-no-files-found: error
          retention-days: 7

  browser-certification:
    name: Browser certification
    if: ${{ always() }}
    needs:
      [
        repository-admission,
        linux-verification,
        windows-portability,
        chromium,
        cross-browser,
        browser-integration,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Retrieve source-certified archives
        if: ${{ needs.repository-admission.outputs.browser_required == 'true' && needs.repository-admission.outputs.package_integration_required == 'true' && needs.linux-verification.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.linux-verification.outputs.package_artifact }}
      - name: Certify browser evidence
        env:
          BROWSER_REQUIRED: ${{ needs.repository-admission.outputs.browser_required }}
          PACKAGE_INTEGRATION_REQUIRED: ${{ needs.repository-admission.outputs.package_integration_required }}
          SCOPE_REASON: ${{ needs.repository-admission.outputs.reason }}
          ADMISSION_RESULT: ${{ needs.repository-admission.result }}
          LINUX_RESULT: ${{ needs.linux-verification.result }}
          WINDOWS_RESULT: ${{ needs.windows-portability.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
          INTEGRATION_RESULT: ${{ needs.browser-integration.result }}
        run: node scripts/certifyBrowser.ts
      - name: Save verified source package evidence
        if: ${{ success() && needs.repository-admission.outputs.browser_required == 'true' && needs.repository-admission.outputs.package_integration_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-source-packages-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: .artifacts/packages
          if-no-files-found: error
          retention-days: 14
